<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reClash - Tạo Ảnh Bìa Bài Viết</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #faf9f6;
      --accent: #e6c687;
      --sub-accent: rgba(230, 198, 135, 0.03);
      --text: #1a1a1a;
      --text-dim: #666666;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--accent);
    }
    h2 {
      margin-top: 0;
      color: #b58d46;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dcd6cd;
      color: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #2b2008;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    #preview-canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #e0d8cc;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎮 reClash Banner Studio</h2>
  
  <label>1. Chọn ảnh từ thiết bị:</label>
  <input type="file" id="fileInput" accept="image/*">

  <label>Hoặc dán Link ảnh trực tiếp:</label>
  <input type="text" id="bgUrl" placeholder="https://example.com/image.jpg">

  <label>2. Nhãn nổi bật (Badge):</label>
  <input type="text" id="badgeText" value="TIN NÓNG GAMING">

  <label>3. Nguồn trang web / Tác giả gốc:</label>
  <input type="text" id="sourceText" placeholder="VD: Nguồn: Gamespot / IGN / Sforum...">

  <label>4. Tiêu đề bài viết:</label>
  <textarea id="titleText" rows="3" placeholder="Nhập tiêu đề bài viết vào đây..."></textarea>

  <button class="btn" onclick="generateBanner()">🎨 Tạo Ảnh Banner 1200x630</button>

  <canvas id="preview-canvas" width="1200" height="630"></canvas>
  <button class="btn" id="btnDownload" style="display:none; background:#b58d46; color:#ffffff;" onclick="downloadImage()">📥 Tải Ảnh Về Máy</button>
</div>

<script>
  let loadedImage = null;

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          loadedImage = img;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function generateBanner() {
    const title = document.getElementById('titleText').value.trim();
    const badge = document.getElementById('badgeText').value.trim() || 'TIN MỚI';
    const source = document.getElementById('sourceText').value.trim();
    const bgUrl = document.getElementById('bgUrl').value.trim();

    if (!title) {
      alert('Vui lòng nhập tiêu đề bài viết!');
      return;
    }

    if (loadedImage) {
      render(loadedImage, title, badge, source);
    } else if (bgUrl) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => render(img, title, badge, source);
      img.onerror = () => {
        alert('Không tải được link ảnh online (do chặn CORS), hệ thống sẽ dùng nền mặc định.');
        render(null, title, badge, source);
      };
      img.src = bgUrl;
    } else {
      render(null, title, badge, source);
    }
  }

  function render(img, title, badge, source) {
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const w = 1200, h = 630;

    // 1. Vẽ nền trắng và ảnh gốc
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    if (img) {
      ctx.drawImage(img, 0, 0, w, h);
    }

    // Phủ lớp màu phụ
    ctx.fillStyle = 'rgba(230, 198, 135, 0.03)';
    ctx.fillRect(0, 0, w, h);

    // 2. Phủ gradient trắng chuyển tiếp để làm nổi bật văn bản màu tối
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
    grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.7)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0.98)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 3. Khung viền màu chủ đạo
    ctx.strokeStyle = '#e6c687';
    ctx.lineWidth = 6;
    ctx.strokeRect(20, 20, w - 40, h - 40);

    // 4. Badge Thương hiệu reClash
    ctx.fillStyle = '#e6c687';
    ctx.fillRect(60, 60, 220, 50);
    ctx.fillStyle = '#2b2008';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('reClash.io.vn', 80, 95);

    // 5. Badge Nổi bật
    ctx.strokeStyle = '#e6c687';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(300, 60, 480, 50);
    ctx.strokeRect(300, 60, 480, 50);
    ctx.fillStyle = '#8f681d';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('🔥 ' + badge.toUpperCase(), 320, 93);

    // 6. Tiêu đề bài viết
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 48px sans-serif';
    wrapText(ctx, title, 60, 340, 1080, 62);

    // 7. Hiển thị Nguồn trang web
    if (source) {
      ctx.fillStyle = '#666666';
      ctx.font = 'italic 20px sans-serif';
      const sourceDisplay = source.toLowerCase().startsWith('nguồn:') ? source : `Nguồn: ${source}`;
      ctx.fillText(sourceDisplay, 60, 575);
    }

    canvas.style.display = 'block';
    document.getElementById('btnDownload').style.display = 'block';
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y);
  }

  function downloadImage() {
    const canvas = document.getElementById('preview-canvas');
    const link = document.createElement('a');
    link.download = 'reclash-banner.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
