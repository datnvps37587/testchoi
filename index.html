<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reClash - Tạo Ảnh Bìa Bài Viết</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #faf9f6;
      --accent: #e6c687;
      --sub-accent: rgba(230, 198, 135, 0.03);
      --text: #1a1a1a;
      --text-dim: #666666;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--accent);
    }
    h2 {
      margin-top: 0;
      color: #b58d46;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dcd6cd;
      color: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .auto-box {
      background: rgba(230, 198, 135, 0.15);
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--accent);
      margin-bottom: 15px;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #2b2008;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    #preview-canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #e0d8cc;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎮 reClash Banner Studio</h2>

  <div class="auto-box">
    <label style="margin-top:0; color:#8f681d;">⚡ Tự động điền dữ liệu (Dán từ Bookmarklet):</label>
    <input type="text" id="autoPasteInput" placeholder="Dán mã đã copy từ Bookmarklet vào đây để tự điền..." oninput="handleAutoFill(this.value)">
  </div>
  
  <label>1. Ảnh bìa (Chọn từ máy hoặc Link ảnh):</label>
  <input type="file" id="fileInput" accept="image/*">
  <input type="text" id="bgUrl" style="margin-top: 6px;" placeholder="https://example.com/image.jpg">

  <label>2. Nhãn nổi bật (Badge):</label>
  <input type="text" id="badgeText" value="TIN NÓNG GAMING">

  <label>3. Tác giả bài viết:</label>
  <input type="text" id="authorText" value="Ẩn danh" placeholder="Tác giả...">

  <label>4. Nguồn trang web:</label>
  <input type="text" id="sourceText" placeholder="Nguồn: IGN / Gamespot...">

  <label>5. Tiêu đề bài viết:</label>
  <textarea id="titleText" rows="2" placeholder="Tiêu đề chính hiển thị trên banner..."></textarea>

  <label>6. Đoạn trích nổi bật:</label>
  <textarea id="descText" rows="2" placeholder="Đoạn mô tả ngắn hoặc Sapo của bài..."></textarea>

  <button class="btn" onclick="generateBanner()">🎨 Tạo Ảnh Banner 1200x630</button>

  <canvas id="preview-canvas" width="1200" height="630"></canvas>
  <button class="btn" id="btnDownload" style="display:none; background:#b58d46; color:#ffffff;" onclick="downloadImage()">📥 Tải Ảnh Về Máy</button>
</div>

<script>
  let loadedImage = null;

  function handleAutoFill(val) {
    try {
      const data = JSON.parse(val);
      if (data.title) document.getElementById('titleText').value = data.title;
      if (data.desc) document.getElementById('descText').value = data.desc;
      if (data.image) document.getElementById('bgUrl').value = data.image;
      if (data.badge) document.getElementById('badgeText').value = data.badge;
      if (data.author) document.getElementById('authorText').value = data.author;
      if (data.source) document.getElementById('sourceText').value = "Nguồn: " + data.source;
      document.getElementById('autoPasteInput').value = "✅ Đã tự động điền đầy đủ!";
    } catch(e) {}
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() { loadedImage = img; };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function generateBanner() {
    const title = document.getElementById('titleText').value.trim();
    const desc = document.getElementById('descText').value.trim();
    const badge = document.getElementById('badgeText').value.trim() || 'TIN MỚI';
    const author = document.getElementById('authorText').value.trim() || 'Ẩn danh';
    const source = document.getElementById('sourceText').value.trim();
    const bgUrl = document.getElementById('bgUrl').value.trim();

    if (!title) {
      alert('Vui lòng nhập tiêu đề bài viết!');
      return;
    }

    if (loadedImage) {
      render(loadedImage, title, desc, badge, author, source);
    } else if (bgUrl) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => render(img, title, desc, badge, author, source);
      img.onerror = () => {
        render(null, title, desc, badge, author, source);
      };
      img.src = bgUrl;
    } else {
      render(null, title, desc, badge, author, source);
    }
  }

  function render(img, title, desc, badge, author, source) {
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const w = 1200, h = 630;

    // 1. Nền trắng và ảnh gốc
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    if (img) {
      ctx.drawImage(img, 0, 0, w, h);
    }

    // Lớp phủ màu phụ
    ctx.fillStyle = 'rgba(230, 198, 135, 0.03)';
    ctx.fillRect(0, 0, w, h);

    // 2. Phủ gradient trắng dồn xuống đáy
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
    grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.65)');
    grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.95)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 3. Khung viền màu chủ đạo
    ctx.strokeStyle = '#e6c687';
    ctx.lineWidth = 6;
    ctx.strokeRect(20, 20, w - 40, h - 40);

    // 4. Badge Brand reClash
    ctx.fillStyle = '#e6c687';
    ctx.fillRect(50, 50, 210, 46);
    ctx.fillStyle = '#2b2008';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('reClash.io.vn', 68, 82);

    // 5. Badge Nổi bật
    ctx.font = 'bold 20px sans-serif';
    const badgeStr = '🔥 ' + badge.toUpperCase();
    const badgeMetrics = ctx.measureText(badgeStr);
    const badgeBoxW = Math.max(badgeMetrics.width + 36, 180);

    ctx.strokeStyle = '#e6c687';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(275, 50, badgeBoxW, 46);
    ctx.strokeRect(275, 50, badgeBoxW, 46);
    ctx.fillStyle = '#8f681d';
    ctx.fillText(badgeStr, 293, 81);

    // 6. Tiêu đề chính
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 38px sans-serif';
    const nextY = wrapText(ctx, title, 50, 365, 1100, 48, 2);

    // 7. Đoạn trích nổi bật
    if (desc) {
      ctx.fillStyle = '#374151';
      ctx.font = '500 19px sans-serif';
      wrapText(ctx, desc, 50, nextY + 24, 1100, 27, 2);
    }

    // 8. Tác giả & Nguồn bài viết
    ctx.fillStyle = '#6b7280';
    ctx.font = 'italic 16px sans-serif';
    let metaInfo = `Tác giả: ${author}`;
    if (source) {
      metaInfo += ` | ${source}`;
    }
    ctx.fillText(metaInfo, 50, 582);

    canvas.style.display = 'block';
    document.getElementById('btnDownload').style.display = 'block';
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
    const words = text.split(' ');
    let line = '';
    let lineCount = 0;
    let currentY = y;

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + ' ';
        currentY += lineHeight;
        lineCount++;
        if (lineCount >= maxLines - 1 && n < words.length - 1) {
          line += '...';
          break;
        }
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, currentY);
    return currentY;
  }

  function downloadImage() {
    const canvas = document.getElementById('preview-canvas');
    const link = document.createElement('a');
    link.download = 'reclash-banner.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
