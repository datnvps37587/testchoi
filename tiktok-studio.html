<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reNews - TikTok Studio Ultra HD v3</title>
  <style>
    :root {
      --bg: #080b11;
      --card: rgba(17, 24, 39, 0.75);
      --card-inner: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.25);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --btn-bg: #ffffff;
      --btn-text: #090d16;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #151d30 0%, var(--bg) 70%);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
    }
    h2 {
      margin-top: 0;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin: 14px 0 6px;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
    }
    #preview-canvas {
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      margin: 22px auto 0;
      border: 1px solid var(--border);
      display: none;
    }
    .highlight-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>reNews TikTok Studio v3</h2>

  <!-- Tính năng mới v3 -->
  <div class="highlight-box">
    <label style="color: #38bdf8; font-weight: bold; margin-top:0;">🌟 Nâng cấp v3 (Chuyên nghiệp hơn):</label>
    
    <label>Watermark (Chống re-up TikTok):</label>
    <input type="text" id="watermarkText" placeholder="@id_tiktok_cua_ban" value="@reNews_Gaming">
    
    <label>Phông chữ Tiêu đề:</label>
    <select id="fontSelect">
      <option value="-apple-system, BlinkMacSystemFont, sans-serif">Mặc định (Hiện đại, Dễ đọc)</option>
      <option value="Impact, sans-serif">Impact (Bản tin nóng, Giật tít)</option>
      <option value="Georgia, serif">Georgia (Báo chí truyền thống)</option>
    </select>
  </div>

  <label>1. Link Logo website:</label>
  <input type="text" id="logoUrl" value="https://datnvps37587.github.io/testchoi/renews.png">

  <label>2. Ảnh bài viết:</label>
  <input type="file" id="fileInput" accept="image/*">
  <input type="text" id="bgUrl" placeholder="Hoặc dán link ảnh...">

  <label>3. Nhãn phân loại:</label>
  <input type="text" id="badgeText" value="TIN NÓNG">

  <label>4. Tác giả & Nguồn:</label>
  <input type="text" id="authorText" value="Ẩn danh">

  <label>5. Tiêu đề bài viết:</label>
  <textarea id="titleText" rows="2" placeholder="Nhập tiêu đề..."></textarea>

  <label>6. Đoạn trích nổi bật:</label>
  <textarea id="descText" rows="4" placeholder="Nhập tóm tắt..."></textarea>

  <button class="btn" onclick="generateBanner()">Tạo Ảnh TikTok Chuẩn Nét</button>
  <canvas id="preview-canvas" width="1080" height="1920"></canvas>
  <button class="btn" id="btnDownload" style="display:none; background: #38bdf8; color: #fff;" onclick="downloadImage()">📥 Tải Ảnh HD Về Máy</button>
</div>

<script>
  let loadedImage = null;

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() { loadedImage = img; };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function loadImageAsync(url) {
    return new Promise((resolve) => {
      if (!url) return resolve(null);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => {
        const proxyImg = new Image();
        proxyImg.crossOrigin = "anonymous";
        proxyImg.onload = () => resolve(proxyImg);
        proxyImg.onerror = () => resolve(null);
        proxyImg.src = "https://images.weserv.nl/?url=" + encodeURIComponent(url);
      };
      img.src = url;
    });
  }

  async function generateBanner() {
    const title = document.getElementById('titleText').value.trim();
    const desc = document.getElementById('descText').value.trim();
    const badge = document.getElementById('badgeText').value.trim() || 'TIN NÓNG';
    const author = document.getElementById('authorText').value.trim();
    const bgUrl = document.getElementById('bgUrl').value.trim();
    const logoUrl = document.getElementById('logoUrl').value.trim();
    const font = document.getElementById('fontSelect').value;
    const watermark = document.getElementById('watermarkText').value.trim();

    if (!title) {
      alert('Vui lòng nhập tiêu đề bài viết!');
      return;
    }

    let bgImg = loadedImage;
    if (!bgImg && bgUrl) bgImg = await loadImageAsync(bgUrl);
    const logoImg = await loadImageAsync(logoUrl);

    renderCanvas(bgImg, logoImg, title, desc, badge, author, font, watermark);
  }

  function renderCanvas(img, logo, title, desc, badge, author, font, watermark) {
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const w = 1080, h = 1920;

    // Background
    ctx.fillStyle = '#080b11';
    ctx.fillRect(0, 0, w, h);

    if (img) {
      ctx.save();
      ctx.filter = 'blur(40px) brightness(0.3)';
      ctx.drawImage(img, -100, -100, w + 200, h + 200);
      ctx.restore();

      const grad = ctx.createLinearGradient(0, 800, 0, h);
      grad.addColorStop(0, 'rgba(8, 11, 17, 0.1)');
      grad.addColorStop(1, '#080b11');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 800, w, h - 800);

      const cardW = 950;
      const cardH = (img.height / img.width) * cardW;
      const cardX = (w - cardW) / 2;
      const cardY = 280;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 20);
      ctx.clip();
      ctx.drawImage(img, cardX, cardY, cardW, cardH);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      var contentStartY = cardY + cardH + 80;
    } else {
      var contentStartY = 600;
    }

    // Logo & Badge
    let nextBadgeX = 65;
    if (logo) {
      const targetH = 46;
      const targetW = (logo.width / logo.height) * targetH;
      ctx.drawImage(logo, 65, 167, targetW, targetH);
      nextBadgeX = 65 + targetW + 30;
    }

    ctx.font = 'bold 22px sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('🔥 ' + badge.toUpperCase(), nextBadgeX, 197);

    // Title (Dùng Font tuỳ chọn)
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 56px ' + font;
    const nextY = wrapText(ctx, title, 65, contentStartY, 950, 75, 4);

    // Description
    if (desc) {
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '400 32px -apple-system, BlinkMacSystemFont, sans-serif';
      wrapText(ctx, desc, 65, nextY + 40, 950, 48, 6);
    }

    // Author
    ctx.fillStyle = '#64748b';
    ctx.font = '400 24px sans-serif';
    ctx.fillText(author, 65, 1800);

    // Watermark (Chữ ký mờ chống re-up)
    if (watermark) {
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.font = 'bold 100px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(watermark, 0, 0);
      ctx.restore();
    }

    canvas.style.display = 'block';
    document.getElementById('btnDownload').style.display = 'block';
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
    const words = text.split(' ');
    let line = '', currentY = y, lineCount = 0;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + ' ';
        currentY += lineHeight;
        lineCount++;
        if (lineCount >= maxLines - 1 && n < words.length - 1) {
          line += '...'; break;
        }
      } else { line = testLine; }
    }
    ctx.fillText(line, x, currentY);
    return currentY;
  }

  function downloadImage() {
    const link = document.createElement('a');
    link.download = 'tiktok-studio-v3.png';
    link.href = document.getElementById('preview-canvas').toDataURL('image/png');
    link.click();
  }
</script>
</body>
</html>
