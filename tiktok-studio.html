<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reClash - TikTok Studio</title>
  <style>
    :root {
      --bg: #080b11;
      --card: rgba(17, 24, 39, 0.75);
      --card-inner: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.25);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --btn-bg: #ffffff;
      --btn-text: #090d16;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #151d30 0%, var(--bg) 70%);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
    }

    h2 {
      margin-top: 0;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin: 14px 0 6px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    .auto-box {
      background: rgba(255, 255, 255, 0.02);
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
      letter-spacing: 0.2px;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.94;
    }

    .btn:active {
      transform: scale(0.985);
    }

    #preview-canvas {
      width: 100%;
      max-width: 360px;
      height: auto;
      border-radius: 14px;
      margin: 22px auto 0;
      border: 1px solid var(--border);
      display: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>reClash TikTok Studio</h2>

  <div class="auto-box">
    <label style="margin-top:0; color:#cbd5e1;">⚡ Dán dữ liệu tự động từ Bookmarklet:</label>
    <input type="text" id="autoPasteInput" placeholder="Dán mã JSON bài viết vào đây..." oninput="handleAutoFill(this.value)">
  </div>
  
  <label>1. Link Logo website:</label>
  <input type="text" id="logoUrl" value="https://datnvps37587.github.io/testchoi/reClash-400x40.png">

  <label>2. Ảnh bài viết:</label>
  <input type="file" id="fileInput" accept="image/*">
  <input type="text" id="bgUrl" style="margin-top: 6px;" placeholder="https://example.com/image.jpg">

  <label>3. Nhãn phân loại:</label>
  <input type="text" id="badgeText" value="TIN NÓNG">

  <label>4. Tác giả & Nguồn:</label>
  <input type="text" id="authorText" value="Ẩn danh" placeholder="Tác giả...">
  <input type="text" id="sourceText" style="margin-top: 6px;" placeholder="Nguồn...">

  <label>5. Tiêu đề bài viết:</label>
  <textarea id="titleText" rows="3" placeholder="Tiêu đề chính..."></textarea>

  <label>6. Đoạn trích nổi bật:</label>
  <textarea id="descText" rows="8" placeholder="Nội dung tóm tắt chi tiết..."></textarea>

  <button class="btn" onclick="generateBanner()">Tạo Ảnh TikTok (1080x1920)</button>

  <div style="text-align: center;">
    <canvas id="preview-canvas" width="1080" height="1920"></canvas>
  </div>
  
  <button class="btn" id="btnDownload" style="display:none; background: #e2e8f0; color:#0f172a;" onclick="downloadImage()">Tải Ảnh Về Máy</button>
</div>

<script>
  let loadedImage = null;

  function handleAutoFill(val) {
    try {
      const data = JSON.parse(val);
      if (data.title) document.getElementById('titleText').value = data.title;
      if (data.desc) document.getElementById('descText').value = data.desc;
      if (data.image) document.getElementById('bgUrl').value = data.image;
      if (data.badge) document.getElementById('badgeText').value = data.badge;
      if (data.author) document.getElementById('authorText').value = data.author;
      if (data.source) document.getElementById('sourceText').value = data.source;
      document.getElementById('autoPasteInput').value = "✅ Đã nhận diện nội dung!";
    } catch(e) {}
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() { loadedImage = img; };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function loadImageAsync(url) {
    return new Promise((resolve) => {
      if (!url) return resolve(null);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => {
        const proxyImg = new Image();
        proxyImg.crossOrigin = "anonymous";
        proxyImg.onload = () => resolve(proxyImg);
        proxyImg.onerror = () => resolve(null);
        proxyImg.src = "https://images.weserv.nl/?url=" + encodeURIComponent(url);
      };
      img.src = url;
    });
  }

  async function generateBanner() {
    const title = document.getElementById('titleText').value.trim();
    const desc = document.getElementById('descText').value.trim();
    const badge = document.getElementById('badgeText').value.trim() || 'TIN TỨC';
    const author = document.getElementById('authorText').value.trim() || 'Ẩn danh';
    const source = document.getElementById('sourceText').value.trim();
    const bgUrl = document.getElementById('bgUrl').value.trim();
    const logoUrl = document.getElementById('logoUrl').value.trim();

    if (!title) {
      alert('Vui lòng nhập tiêu đề bài viết!');
      return;
    }

    let bgImg = loadedImage;
    if (!bgImg && bgUrl) {
      bgImg = await loadImageAsync(bgUrl);
    }

    const logoImg = await loadImageAsync(logoUrl);

    renderDualLayer(bgImg, logoImg, title, desc, badge, author, source);
  }

  function renderDualLayer(img, logo, title, desc, badge, author, source) {
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const w = 1080, h = 1920;

    // 1. Nền tối sâu
    ctx.fillStyle = '#080b11';
    ctx.fillRect(0, 0, w, h);

    if (img) {
      // 2. Lớp Blur nền toàn màn hình
      ctx.save();
      ctx.filter = 'blur(48px) brightness(0.32) saturate(1.2)';
      const imgRatio = img.width / img.height;
      const canvasRatio = w / h;
      let bgW, bgH, bgX, bgY;
      if (imgRatio > canvasRatio) {
        bgH = h + 100;
        bgW = bgH * imgRatio;
      } else {
        bgW = w + 100;
        bgH = bgW / imgRatio;
      }
      bgX = (w - bgW) / 2;
      bgY = (h - bgH) / 2;
      ctx.drawImage(img, bgX, bgY, bgW, bgH);
      ctx.restore();

      // 3. Gradient chuyển tiếp siêu mịn
      const startY = 700;
      const grad = ctx.createLinearGradient(0, startY, 0, h);
      
      grad.addColorStop(0, 'rgba(8, 11, 17, 0)');
      
      // Chuyển mờ rất êm theo đường cong tự nhiên
      grad.addColorStop(0.25, 'rgba(8, 11, 17, 0.35)');
      grad.addColorStop(0.55, 'rgba(8, 11, 17, 0.85)');
      grad.addColorStop(0.8, 'rgba(8, 11, 17, 0.98)');
      grad.addColorStop(1, '#080b11');
      
      ctx.fillStyle = grad;
      ctx.fillRect(0, startY, w, h - startY);

      // 4. Khung ảnh chính: Hạ thấp xuống y=300 để tạo bố cục cân xứng vàng
      const cardMargin = 65;
      const cardW = w - (cardMargin * 2); // 950px
      const cardH = (img.height / img.width) * cardW;
      const cardX = cardMargin;
      const cardY = 300;

      // Đổ bóng 3D
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 18;

      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 20);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.restore();

      // Vẽ ảnh chính
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 20);
      ctx.clip();
      ctx.drawImage(img, cardX, cardY, cardW, cardH);
      
      // Viền kính siêu mỏng
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      var contentStartY = cardY + cardH + 75;
    } else {
      var contentStartY = 500;
    }

    // 5. Logo website: Hạ nhẹ xuống y=160
    let nextBadgeX = 65;
    if (logo) {
      const srcW = logo.width;
      const srcH = logo.height;
      const cropX = srcW * 0.28;
      const cropW = srcW * 0.44;
      const cropY = 0;
      const cropH = srcH;
      
      const targetH = 46;
      const targetW = (cropW / cropH) * targetH;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(65, 160, targetW + 20, targetH + 14, 10);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.clip();
      ctx.drawImage(logo, cropX, cropY, cropW, cropH, 75, 167, targetW, targetH);
      ctx.restore();

      nextBadgeX = 65 + targetW + 32;
    }

    // 6. Badge thể loại
    ctx.font = '600 20px -apple-system, BlinkMacSystemFont, sans-serif';
    const badgeStr = badge.toUpperCase();
    const badgeMetrics = ctx.measureText(badgeStr);
    const badgeBoxW = badgeMetrics.width + 36;
    const badgeBoxH = 60;

    ctx.beginPath();
    ctx.roundRect(nextBadgeX, 160, badgeBoxW, badgeBoxH, 10);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(badgeStr, nextBadgeX + 18, 197);

    // 7. Tiêu đề chính
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    const nextY = wrapText(ctx, title, 65, contentStartY, 950, 70, 3);

    // 8. Đoạn trích nổi bật
    let descEndY = nextY;
    if (desc) {
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '400 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      descEndY = wrapText(ctx, desc, 65, nextY + 48, 950, 48, 7);
    }

    // 9. CTA Box: Tự động giữ khoảng cách cân đối và đổi thành lời gợi ý chia sẻ/bàn luận
    const ctaY = Math.min(Math.max(descEndY + 60, 1500), 1640);
    ctx.beginPath();
    ctx.roundRect(65, ctaY, 950, 72, 14);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '500 24px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('💬 Chia sẻ góc nhìn của bạn ngay nhé!', 100, ctaY + 45);

    // 10. Tác giả & Nguồn
    ctx.fillStyle = '#64748b';
    ctx.font = '400 22px -apple-system, BlinkMacSystemFont, sans-serif';
    let metaInfo = author;
    if (source) metaInfo += ` • ${source}`;
    ctx.fillText(metaInfo, 65, 1780);

    canvas.style.display = 'block';
    document.getElementById('btnDownload').style.display = 'block';
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 8) {
    const words = text.split(' ');
    let line = '';
    let lineCount = 0;
    let currentY = y;

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + ' ';
        currentY += lineHeight;
        lineCount++;
        if (lineCount >= maxLines - 1 && n < words.length - 1) {
          line += '...';
          break;
        }
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, currentY);
    return currentY;
  }

  function downloadImage() {
    const canvas = document.getElementById('preview-canvas');
    const link = document.createElement('a');
    link.download = 'reclash-tiktok-balanced.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
